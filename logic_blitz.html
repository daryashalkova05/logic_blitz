<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Логический блиц — 8 класс</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', 'Helvetica', sans-serif;
    }

    html, body {
        height: 100%;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #fff;
        overflow: hidden;
    }

    .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3vh 4vw;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 2.5vw;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .counter {
        background: rgba(255,255,255,0.15);
        padding: 1vh 2vw;
        border-radius: 15px;
        font-size: 2vw;
    }

    .question-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 2vw;
    }

    .question-text {
        font-size: 4.5vw;
        font-weight: bold;
        line-height: 1.3;
        text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        max-width: 90%;
        margin-bottom: 3vh;
    }

    .feedback {
        min-height: 8vh;
        font-size: 3vw;
        font-weight: bold;
        text-align: center;
        padding: 1vh 2vw;
        border-radius: 15px;
        display: none;
        margin-bottom: 2vh;
    }

    .feedback.correct {
        background: rgba(46, 204, 113, 0.9);
        display: block;
    }

    .feedback.wrong {
        background: rgba(231, 76, 60, 0.9);
        display: block;
    }

    .explanation {
        font-size: 2.2vw;
        margin-top: 1vh;
        font-weight: normal;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 2vw;
        flex-wrap: wrap;
        margin-bottom: 2vh;
    }

    .btn {
        font-size: 2.5vw;
        font-weight: bold;
        padding: 2.5vh 3vw;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 22vw;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        color: #fff;
    }

    .btn-true { background: #27ae60; }
    .btn-false { background: #c0392b; }
    .btn-not { background: #7f8c8d; }

    .btn:hover:not(:disabled) {
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn.selected-correct {
        background: #2ecc71 !important;
        box-shadow: 0 0 30px #2ecc71;
    }

    .btn.selected-wrong {
        background: #e74c3c !important;
        box-shadow: 0 0 30px #e74c3c;
    }

    .btn.show-correct {
        background: #2ecc71 !important;
        box-shadow: 0 0 30px #2ecc71;
    }

    .next-btn {
        font-size: 2.5vw;
        font-weight: bold;
        padding: 2vh 4vw;
        background: #f39c12;
        color: #fff;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        display: none;
        margin: 0 auto;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .next-btn:hover {
        background: #e67e22;
        transform: translateY(-3px);
    }

    .final-screen {
        display: none;
        text-align: center;
    }

    .final-screen h1 {
        font-size: 6vw;
        margin-bottom: 3vh;
        text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
    }

    .final-screen p {
        font-size: 3.5vw;
        margin-bottom: 4vh;
    }

    .restart-btn {
        font-size: 2.5vw;
        padding: 2vh 4vw;
        background: #16a085;
        color: #fff;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .restart-btn:hover {
        background: #1abc9c;
    }
</style>
</head>
<body>

<div class="container" id="gameScreen">
    <div class="header">
        <div>🧠 Логический блиц</div>
        <div class="counter" id="counter">Вопрос 1 из 15</div>
    </div>

    <div class="question-area">
        <div class="question-text" id="questionText">Загрузка...</div>
        <div class="feedback" id="feedback"></div>
    </div>

    <div>
        <div class="buttons" id="buttons">
            <button class="btn btn-true" data-answer="true">✅ ИСТИННО</button>
            <button class="btn btn-false" data-answer="false">❌ ЛОЖНО</button>
            <button class="btn btn-not" data-answer="not_statement">🚫 НЕ ВЫСКАЗЫВАНИЕ</button>
        </div>
        <button class="next-btn" id="nextBtn">Следующий вопрос ➡️</button>
    </div>
</div>

<div class="container final-screen" id="finalScreen">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h1>🎉 Блиц завершён!</h1>
        <p id="finalScore">Ваш результат: 0 из 15</p>
        <button class="restart-btn" onclick="location.reload()">🔄 Начать заново</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "«Байт состоит из 10 бит».",
            answer: "false",
            explanation: "Ложь. 1 байт = 8 бит."
        },
        {
            text: "«Сумма внутренних углов любого треугольника равна 180 градусам».",
            answer: "true",
            explanation: "Истина. Это верное геометрическое утверждение."
        },
        {
            text: "«Который сейчас час?»",
            answer: "not_statement",
            explanation: "Не высказывание. Это вопросительное предложение."
        },
        {
            text: "«Число 15 делится на 3 без остатка».",
            answer: "true",
            explanation: "Истина. 15 ÷ 3 = 5."
        },
        {
            text: "«Решите задачу номер пять из учебника».",
            answer: "not_statement",
            explanation: "Не высказывание. Это побудительное предложение (приказ)."
        },
        {
            text: "«Озеро Байкал является самым глубоким озером в мире».",
            answer: "true",
            explanation: "Истина. Глубина Байкала — 1642 метра."
        },
        {
            text: "«Клавиатура компьютера является устройством вывода информации».",
            answer: "false",
            explanation: "Ложь. Клавиатура — это устройство ввода."
        },
        {
            text: "«Этот фильм самый интересный в мире».",
            answer: "not_statement",
            explanation: "Не высказывание. Субъективное мнение, нельзя оценить объективно."
        },
        {
            text: "«В году 13 месяцев».",
            answer: "false",
            explanation: "Ложь. В году 12 месяцев."
        },
        {
            text: "«Как же красиво сегодня светит солнце!»",
            answer: "not_statement",
            explanation: "Не высказывание. Восклицательное предложение, выражает эмоцию."
        },
        {
            text: "«В двоичной системе счисления используются только цифры 0 и 1».",
            answer: "true",
            explanation: "Истина. Это основа двоичной системы."
        },
        {
            text: "«Существует самое большое натуральное число».",
            answer: "false",
            explanation: "Ложь. Ряд натуральных чисел бесконечен."
        },
        {
            text: "«Не забудь сохранить файл перед закрытием программы!»",
            answer: "not_statement",
            explanation: "Не высказывание. Побудительное предложение (совет)."
        },
        {
            text: "«Операционная система Windows является примером аппаратного обеспечения».",
            answer: "false",
            explanation: "Ложь. Windows — это программное обеспечение (software)."
        },
        {
            text: "«Число x больше пяти».",
            answer: "not_statement",
            explanation: "Не высказывание. Это высказывательная форма (предикат) — нельзя оценить без значения x."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById('questionText');
    const feedback = document.getElementById('feedback');
    const counter = document.getElementById('counter');
    const nextBtn = document.getElementById('nextBtn');
    const buttons = document.querySelectorAll('.btn');
    const gameScreen = document.getElementById('gameScreen');
    const finalScreen = document.getElementById('finalScreen');
    const finalScore = document.getElementById('finalScore');

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestion];
        questionText.textContent = q.text;
        counter.textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
        feedback.className = 'feedback';
        feedback.style.display = 'none';
        nextBtn.style.display = 'none';
        buttons.forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('selected-correct', 'selected-wrong', 'show-correct');
        });
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            if (answered) return;
            answered = true;

            const userAnswer = btn.dataset.answer;
            const correctAnswer = questions[currentQuestion].answer;
            const q = questions[currentQuestion];

            buttons.forEach(b => b.disabled = true);

            if (userAnswer === correctAnswer) {
                score++;
                btn.classList.add('selected-correct');
                feedback.className = 'feedback correct';
                feedback.innerHTML = `✅ ВЕРНО!<div class="explanation">${q.explanation}</div>`;
            } else {
                btn.classList.add('selected-wrong');
                // Подсветить правильный ответ
                buttons.forEach(b => {
                    if (b.dataset.answer === correctAnswer) {
                        b.classList.add('show-correct');
                    }
                });
                feedback.className = 'feedback wrong';
                feedback.innerHTML = `❌ НЕВЕРНО<div class="explanation">${q.explanation}</div>`;
            }
            feedback.style.display = 'block';

            if (currentQuestion < questions.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                setTimeout(showFinal, 2500);
            }
        });
    });

    nextBtn.addEventListener('click', () => {
        currentQuestion++;
        loadQuestion();
    });

    function showFinal() {
        gameScreen.style.display = 'none';
        finalScreen.style.display = 'flex';
        finalScore.textContent = `Ваш результат: ${score} из ${questions.length}`;
    }

    loadQuestion();
</script>

</body>
</html>
